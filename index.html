<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <!-- Mode Selection -->
  <div id="mode-selection">
    <p>Choose Game Mode:</p>
    <button id="twoPlayerBtn">2 Players</button>
    <button id="aiBtn">Play vs Computer</button>
  </div>

  <!-- Scoreboard -->
  <div id="scores" style="display:none;">
    <div>Player X Wins: <span id="xStreak">0</span></div>
    <div>Player O Wins: <span id="oStreak">0</span></div>
  </div>

  <!-- Game Board -->
  <div id="game" style="display:none;">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <p id="status"></p>
  <button id="resetBtn" style="display:none;">Restart Game</button>

  <script src="script.js"></script>
</body>
</html>
